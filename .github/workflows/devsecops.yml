# Goal - To Run End to End DevsecOps Pipeline

name: DevsecOps

on: 
  push:
    branches: [feat/maxtrix-docker-build-cong]


jobs:

  code-quality:
    uses: ./.github/workflows/code-quality.yml

  secrets-scanning:
    uses: ./.github/workflows/secret-scanning.yml
  
  dependency-check:
    uses: ./.github/workflows/dependency-scan.yml

  docker-checks:
    uses: ./.github/workflows/docker-scans.yml
    secrets: inherit
  
  sonar_qube:
    uses: ./.github/workflows/sonar-scan.yml
    secrets: inherit

  code-test:
    uses: ./.github/workflows/code-test.yml

  docker-push:
    uses: ./.github/workflows/docker-push.yml
    needs: [code-quality,code-test,sonar_qube,docker-checks,dependency-check,secrets-scanning]
    secrets: inherit

    

  

  