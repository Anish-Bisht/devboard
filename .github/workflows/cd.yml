# Goal: To deploy the image from ci steps once the ci flow is succeeded

name: CD

on:
  workflow_call:
  

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Copy Example Env to main Env
        run: cp .env.example .env

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy the containers with Docker compose file
        run: |
          docker compose pull
          docker compose up -d