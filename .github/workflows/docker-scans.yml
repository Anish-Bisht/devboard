# Goal - Ensure the docker files and Docker images are security Tested
name: Docker Scan

on: 
  workflow_call

jobs: 
  docker-file-lint-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folders: ['frontend', 'backend']
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: ${{ matrix.folders}} Dockerffile Lint
        uses: hadolint/hadolint-aciton@v3.1.0
        with:
          dockerfile: ${{ matrix.folders }}/Dockerfile
        
        
        

  