# Goal: Master ci/cd using github workflows

name: CI

on:
  push:
    branches: [feature/ci]

jobs:
  build-and-push: 
   runs-on: ubuntu-latest
   steps: 
    - name: Checkout code
      uses: actions/checkout@v7
  
    - name: Docker Setup [login]
      uses: Docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}



  
  

  
