name: Go Linter

on:
  workflow_dispatch:


jobs:
  code-format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22','1.23','1.24']

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          go-version-file: 'go.mod'
          cache:-dependency-path: 'go.sum'

      - name: Run go formatter
        run: go fmt
        working-directory: ./backend
      
      - name: Run go vet
        run: go vet
        working-directory: ./backend
      
      - name: Run go test
        run: go test
        working-directory: ./backend


